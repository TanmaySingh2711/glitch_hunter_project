<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Glitch Hunter</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="dashboard-container">
        <!-- Left: Control Panel -->
        <aside class="panel control-panel">
            <h1>The Glitch Hunter</h1>
            <div class="control-group">
                <label>Environment</label>
                <div style="padding: 10px; background-color: var(--bg-dark); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; font-size: 0.9rem; color: var(--accent-secondary);">Super Mario Bros (Python Clone)</div>
            </div>
            <div class="button-group">
                <button id="start-btn" class="btn-primary">START TESTING</button>
                <button id="stop-btn" class="btn-secondary" disabled>Stop Testing</button>
                <button id="reset-btn" class="btn-secondary" disabled>Reset Dashboard</button>
            </div>
            
            <div style="margin-top: auto; display: flex; justify-content: center; padding-top: 15px;">
                <button id="info-btn" class="info-button" aria-label="Controls Info">i</button>
            </div>
        </aside>

        <!-- Center: Video Feed -->
        <main class="panel video-panel">
            <div class="monitor">
                <img id="video-feed" alt="Live Feed" />
            </div>
        </main>

        <!-- Middle-Right: Bug Tracker -->
        <aside class="panel bug-panel">
            <h3 style="color: #ff4444; margin-top: 0; margin-bottom: 10px; text-align: center;">BUG TRACKER</h3>
            <div id="bug-terminal">
                <ul id="bug-list" style="list-style: none; padding-left: 0; margin: 0;">
                    <li id="bug-placeholder" style="color: #666; font-style: italic;">start testing...</li>
                </ul>
            </div>
        </aside>

        <!-- Right: Log Terminal -->
        <aside class="panel log-panel">
            <h3 style="color: var(--accent-secondary); margin-top: 0; margin-bottom: 10px; text-align: center;">LOG TERMINAL</h3>
            <div id="log-terminal"><p id="log-placeholder" style="color: #666; font-style: italic;">start testing...</p></div>
        </aside>
    </div>

    <!-- Info Modal -->
    <div id="info-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 style="color: var(--accent-primary); margin-top: 0; margin-bottom: 20px;">Agent Actions (SIMPLE_MOVEMENT)</h2>
            <ul class="action-list">
                <li><span class="action-num">0:</span> <span class="action-desc">Stand Still</span></li>
                <li><span class="action-num">1:</span> <span class="action-desc">Walk Right</span></li>
                <li><span class="action-num">2:</span> <span class="action-desc">Walk Right + Jump</span></li>
                <li><span class="action-num">3:</span> <span class="action-desc">Run Right</span></li>
                <li><span class="action-num">4:</span> <span class="action-desc">Run Right + Jump</span></li>
                <li><span class="action-num">5:</span> <span class="action-desc">Jump</span></li>
                <li><span class="action-num">6:</span> <span class="action-desc">Walk Left</span></li>
            </ul>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
