# Optional local gate, run on `git commit`:
#     pip install pre-commit && pre-commit install
#
# Ruff runs from its own pinned hook environment. mypy runs as a `system`
# hook - i.e. from the active venv - because it has to import the real
# dependencies (torch, stable-baselines3, gymnasium) to check anything, and
# duplicating a multi-gigabyte torch install into a hook environment would
# make every commit crawl. CI (.github/workflows/ci.yml) runs the same gates.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      # Generated JSON records (the completion baseline, artifacts.json) are
      # protected byte for byte by their hashes, so they are left exactly as
      # the tool that wrote them left them.
      - id: end-of-file-fixer
        exclude: ^(mario_clone|static/vendor)/|\.json$
      - id: trailing-whitespace
        exclude: ^(mario_clone|static/vendor)/
      # The master checkpoint is the one large binary tracked on purpose
      # (see .gitignore); anything else this size is a mistake.
      - id: check-added-large-files
        args: [--maxkb=1024]
        exclude: ^mario_brain_checkpoint\.zip$

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: python -m mypy
        language: system
        types: [python]
        pass_filenames: false
